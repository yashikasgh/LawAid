
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: lawaid_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawaid123}
      POSTGRES_DB: ${POSTGRES_DB:-lawaid}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawaid} -d ${POSTGRES_DB:-lawaid}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: lawaid_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: lawaid_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lawaid}:${POSTGRES_PASSWORD:-lawaid123}@postgres:5432/${POSTGRES_DB:-lawaid}
      - MONGO_URL=mongodb://mongo:27017/lawaid
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawaid_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:

